name: Build Android (Tauri)

# Unsigned release artifacts: the AAB and the APK prove the Android arm builds
# and packages. Neither installs nor uploads to Google Play until a keystore
# signs them (/iblai-vibe-ops-release). The generated project under
# src-tauri/gen/android is committed; `tauri android init` runs only without it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.0.0) - leave empty to use tauri.conf.json"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-android-build
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android (.aab, .apk)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-android-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-android-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The runner image ships the SDK (ANDROID_HOME), an NDK (ANDROID_NDK_HOME)
      # and JDK 17 (JAVA_HOME); the Tauri CLI reads the NDK from NDK_HOME.
      - name: Point the Tauri CLI at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Override version
        if: inputs.version != ''
        working-directory: src-tauri
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$APP_VERSION\"/" tauri.conf.json
          echo "Version set to $APP_VERSION"

      - name: Initialize Android project (only without a committed one)
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            pnpm exec tauri android init --ci
          fi

      - name: Build Android app
        run: pnpm exec tauri android build --apk --aab --ci

      # Google Play requires 16 KB page alignment; src-tauri/.cargo/config.toml
      # passes the linker flags. Fail if a build dropped them.
      - name: Check 16 KB page alignment
        run: |
          LIB=src-tauri/target/aarch64-linux-android/release/libapp_lib.so
          [ -f "$LIB" ] || { echo "::error::$LIB not found"; exit 1; }
          READELF="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -l "$LIB" | grep LOAD
          "$READELF" -l "$LIB" | awk '/LOAD/ && $NF != "0x4000" { bad = 1 } END { exit bad }' \
            || { echo "::error::$LIB is not 16 KB aligned"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-android
          path: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
