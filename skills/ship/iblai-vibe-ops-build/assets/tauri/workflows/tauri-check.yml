name: Shell check

# Compiles and tests the Tauri shell wherever it changes: rustfmt and the unit
# tests, `cargo check` with warnings denied on Linux, macOS and Windows, the iOS
# arm from the Mac, then the Linux binary headless against a local page — the
# guard and both sign-in returns (scripts/shell-test.sh --smoke). Bundles come
# from the tauri-build-* workflows.

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/shell-test.sh"
      - "scripts/shell-test-server.mjs"
      - ".github/workflows/tauri-check.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/shell-test.sh"
      - "scripts/shell-test-server.mjs"
      - ".github/workflows/tauri-check.yml"

permissions:
  contents: read

concurrency:
  group: tauri-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · check · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-check-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-check-${{ matrix.os }}-

      - run: cargo fmt --check
        if: runner.os == 'Linux'
        working-directory: src-tauri

      - run: cargo check
        working-directory: src-tauri
        env:
          RUSTFLAGS: -Dwarnings

      - run: cargo test
        working-directory: src-tauri
        env:
          RUSTFLAGS: -Dwarnings

      # The ASWebAuthenticationSession arm compiles only for Apple targets.
      - name: Check the iOS arm
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios
          cargo check --target aarch64-apple-ios
        working-directory: src-tauri
        env:
          RUSTFLAGS: -Dwarnings

  smoke:
    name: headless smoke (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb
          # Without a desktop session WebKitGTK waits ~30 s for the portal; no service file, no wait.
          sudo rm -f /usr/share/dbus-1/services/org.freedesktop.portal.Desktop.service

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-smoke-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-smoke-

      - run: pnpm shell:smoke
