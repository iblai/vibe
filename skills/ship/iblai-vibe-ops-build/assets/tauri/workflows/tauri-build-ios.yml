name: Build iOS (Tauri)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.0.0) - leave empty to use tauri.conf.json"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-ios-build
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS (.ipa)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-ios-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-ios-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Override version
        if: inputs.version != ''
        working-directory: src-tauri
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$APP_VERSION\"/" tauri.conf.json
          echo "Version set to $APP_VERSION"

      - name: Decode App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "APPLE_API_KEY_PATH=$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Initialize iOS project (only without a committed one)
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            pnpm exec tauri ios init --ci
          fi

      - name: Build iOS app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: pnpm exec tauri ios build --export-method app-store-connect

      - name: Locate IPA
        id: ipa
        run: |
          IPA_PATH=$(find src-tauri/gen/apple -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA file found"
            exit 1
          fi
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-ios-ipa
          path: ${{ steps.ipa.outputs.ipa_path }}
          if-no-files-found: error

      - name: Clean up API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
