# Cargo dependencies for the Code mode Rust modules.
# Merge into `src-tauri/Cargo.toml` — entries already present from the
# Tauri shell (`/iblai-vibe-ops-build`) are marked so you don't duplicate.
#
# What each is for:
#   - reqwest  : opencode release download, proxy upstream calls, the phone
#                client's HTTP + SSE to the paired desktop
#   - tokio / futures-util / tokio-stream : the ACP stdio loop, the proxy,
#                SSE translation on mobile
#   - axum / http : the loopback token-injecting proxy (opencode_proxy.rs)
#                and the phone-access host's management endpoints
#   - sha2 / hex : per-session proxy secrets + download checksums
#   - url / urlencoding : upstream URL composition, path-segment escaping
#   - base64   : pairing payload transport
#   - if-addrs : every local interface address for the pairing QR (real LAN
#                NICs must come before VPN tunnels)
#   - qrcode   : the pairing QR as SVG (pure Rust, desktop popover only)
#   - tauri-plugin-os / -dialog / -shell : platform(), the folder picker,
#                opening the workspace
#   - tauri-plugin-barcode-scanner (mobile) : scanning the pairing QR

[dependencies]
# --- already in the shell template ---
# tauri = { version = "2", features = ["devtools"] }
# tauri-plugin-opener = "2"
# tauri-plugin-deep-link = "2"
# serde = { version = "1.0", features = ["derive"] }
# serde_json = "1.0"
# url = "2"

# --- add for Code mode ---
tauri-plugin-shell = "2"
tauri-plugin-os = "2.3.2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "blocking",
    "rustls-tls",
] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-stream = "0.1"
axum = "0.8"
http = "1.0"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2.1"
base64 = "0.22"
# All local interface addresses — the phone-pairing address list must prefer
# real LAN NICs over VPN tunnels, which the UDP default-route trick cannot do.
if-addrs = "0.14"
# QR rendering (SVG) for phone pairing; pure Rust, desktop popover only.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "ios")'.dependencies]
# QR pairing: the phone scans the desktop's pairing code with the camera.
tauri-plugin-barcode-scanner = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-barcode-scanner = "2"

# `tauri` must expose `protocol-asset` if you serve workspace files to the
# webview; the OS enables `features = ["protocol-asset", "devtools"]`.
