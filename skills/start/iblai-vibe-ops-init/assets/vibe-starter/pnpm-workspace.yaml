allowBuilds:
  canvas: false
  msw: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - "@iblai/*"
overrides:
  # Security floors for exact pins upstream; drop each once its pinner moves past it.
  axios@1: ^1.20.0 # @iblai/iblai-js, @iblai/web-utils pin 1.13.6
  dompurify@3: ^3.4.17 # @iblai/web-containers pins 3.3.3
  "@tiptap/core@3": ^3.30.5 # @iblai/web-containers pins 3.20.4
  prismjs@1: ^1.30.0 # refractor@3 asks ~1.27.0
  "@modelcontextprotocol/sdk@1": ^1.31.0 # @iblai/mcp 1.28.0 and @iblai/web-utils 2.6.1 pin 1.27.1; shadcn 4.6.0 asks ^1.26.0 — GHSA-6qxp-vccf-f47h
  prosemirror-view@1: ^1.42.3 # @tiptap/pm 3.20.4 (pinned by @iblai/web-containers) resolves 1.41.8 — GHSA-c8x8-7fp4-3x9w
  proxy-addr@2: ^2.0.8 # express 5 asks ^2.0.7, lock had 2.0.7 — GHSA-jqcg-44mw-7w3h
  source-map-js@1: ^1.2.2 # @tailwindcss/node asks ^1.2.1, lock had 1.2.1 — GHSA-68fv-2mgg-jv7q
  qs@6: ^6.16.1 # express 5 asks ^6.16.0 (via @iblai/mcp > @modelcontextprotocol/sdk) — GHSA-6pq8-jhm2-2vcw
  "@hono/node-server@1": ^2.1.3 # @modelcontextprotocol/sdk accepts ^1.19.9 || ^2.0.5; every 1.x past 1.19.9 is affected — GHSA-rmxm-3fg6-px4f
  zod@4: ^4.6.6 # @iblai/mcp 1.29.0 asks 4.3.6 — GHSA-mrhx-c7xc-m3w5
  katex@0: ^0.18.2 # @iblai/web-containers 1.41.1 and rehype-katex 7 ask 0.16 — GHSA-238p-pmpm-9mq7
# zod 3 (GHSA-mrhx-c7xc-m3w5) is fixed only in zod 4.6.6; @iblai/data-layer
# 1.30.1 and @shadcn/ui (through @iblai/web-containers) still ask for zod 3.
# The zod 4 copy is floored above. Ignored until both move to zod 4.
# braces <= 3.0.3 (GHSA-vfj7-8cjw-p6xm) has no patched release. It reaches the
# starter two ways: through rollup-plugin-copy, which @iblai/data-layer,
# @iblai/web-utils and @iblai/web-containers list as a runtime dependency even
# though it is a Rollup build plugin nothing in an app imports, and through the
# starter's own shadcn dependency (fast-glob, ts-morph). Neither path runs
# braces on user input. Ignored until braces ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-mrhx-c7xc-m3w5
