allowBuilds:
  canvas: false
  msw: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - "@iblai/*"
# `@iblai/web-containers` 1.16.1 was published against an unreleased
# `@iblai/data-layer` -- it imports `useGetApiKeyQuery`,
# `useUpdateApiKeyMutation`, `useGetApiKeyFieldPermissionsQuery` and
# `unwrapApiTokenList`, none of which exist in data-layer 1.12.0 (the latest
# published, and the version `@iblai/iblai-js` itself pins). Any import from
# `@iblai/iblai-js/web-containers/next` fails the Turbopack build with 16
# "export doesn't exist in target module" errors. Holding web-containers at
# 1.16.0 -- the last version whose imports data-layer satisfies -- lets us stay
# on the latest iblai-js. Drop this override once data-layer ships those
# exports; iblai-js 2.3.1..2.3.3 are all affected.
overrides:
  "@iblai/web-containers": 1.16.0
  # Security floors for exact pins upstream; drop each once its pinner moves past it.
  axios@1: ^1.20.0 # @iblai/iblai-js, @iblai/web-utils pin 1.13.6
  dompurify@3: ^3.4.16 # @iblai/web-containers pins 3.3.3
  "@tiptap/core@3": ^3.30.5 # @iblai/web-containers pins 3.20.4
  prismjs@1: ^1.30.0 # refractor@3 asks ~1.27.0
  "@modelcontextprotocol/sdk@1": ^1.31.0 # @iblai/mcp 1.28.0, @iblai/web-utils 2.6.1 pin 1.27.1 — GHSA-6qxp-vccf-f47h
  prosemirror-view@1: ^1.42.3 # @tiptap/pm 3.20.4 (pinned by @iblai/web-containers) resolves 1.41.8 — GHSA-c8x8-7fp4-3x9w
  proxy-addr@2: ^2.0.8 # express 5 asks ^2.0.7, lock had 2.0.7 — GHSA-jqcg-44mw-7w3h
  source-map-js@1: ^1.2.2 # @tailwindcss/node asks ^1.2.1, lock had 1.2.1 — GHSA-68fv-2mgg-jv7q
# braces <= 3.0.3 (GHSA-vfj7-8cjw-p6xm) has no patched release. It reaches the
# starter only through rollup-plugin-copy, which @iblai/data-layer,
# @iblai/web-utils and @iblai/web-containers list as a runtime dependency even
# though it is a Rollup build plugin nothing in an app imports. Ignored until a
# fix ships or the SDK packages move it to devDependencies.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
