name: skills-ci

on:
  pull_request:
    # `labeled` included so adding the run-tests label to an open PR triggers a run.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    # Weekly live smoke (Mon 04:17 UTC) — runs only when live secrets are set.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: skills-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STARTER_DIR: skills/start/iblai-vibe-ops-init/assets/vibe-starter

jobs:
  # ---------------------------------------------------------------- tier 0/1/1.5
  # Merge-required: fails until the PR carries the run-tests label. The check is a
  # step, not a job-level if: — a skipped job counts as a passing required check.
  deterministic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: run-tests label present
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'run-tests') }}
        run: |
          echo "::error::Add the run-tests label to this PR — skills-ci must run and pass before it can merge."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every check below is scoped to what the PR changed (an empty list means
      # "all" to the scripts). The audit runs only when vibe-starter changed; a
      # PR that touches scripts/, .github/ or vibe-starter runs everything.
      - name: Changed files
        id: changed
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git diff --name-only "$BASE_REF...HEAD" > "$RUNNER_TEMP/changed"
          full=false; starter=false; any_skill=false
          if grep -qE "^(scripts/|\.github/|$STARTER_DIR/)" "$RUNNER_TEMP/changed"; then full=true; fi
          if grep -q "^$STARTER_DIR/" "$RUNNER_TEMP/changed"; then starter=true; fi
          if grep -q "^skills/" "$RUNNER_TEMP/changed"; then any_skill=true; fi
          files=""; dirs=(); skills=(); api=()
          if [ "$full" = false ]; then
            files=$(paste -sd' ' "$RUNNER_TEMP/changed")
            for d in $(awk -F/ '$1=="skills" && NF>3 {print $1"/"$2"/"$3}' "$RUNNER_TEMP/changed" | sort -u); do
              if [ -d "$d" ]; then dirs+=("$d"); fi
            done
            for d in "${dirs[@]}"; do
              skills+=("$(basename "$d")")
              if grep -qE '^\s*kind:\s*api\b' "$d/SKILL.md" 2>/dev/null; then api+=("$(basename "$d")"); fi
            done
          fi
          echo "$(wc -l < "$RUNNER_TEMP/changed") changed files; full=$full starter=$starter skills=${skills[*]} api=${api[*]}"
          {
            echo "full=$full"; echo "starter=$starter"; echo "any_skill=$any_skill"
            echo "files=$files"; echo "dirs=${dirs[*]}"
            echo "skills=$(IFS=,; echo "${skills[*]}")"; echo "api=$(IFS=,; echo "${api[*]}")"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.STARTER_DIR }}/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.STARTER_DIR }}/pnpm-lock.yaml

      - name: Validate skills (spec conformance)
        if: steps.changed.outputs.full == 'true' || steps.changed.outputs.dirs != ''
        env:
          DIRS: ${{ steps.changed.outputs.dirs }}
        run: bash scripts/validate-skills.sh $DIRS

      - name: SDK pin drift
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/check-sdk-pins.mjs $FILES

      - name: No known vulnerabilities in vibe-starter (moderate+)
        if: steps.changed.outputs.starter == 'true'
        working-directory: ${{ env.STARTER_DIR }}
        run: pnpm audit --audit-level=moderate

      - name: Cross-repo links resolve
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/check-links.mjs $FILES

      - name: API endpoints & request fields match the live schema
        # Fetch once with retries (the schema is ~7.5MB) so a flaky network is a
        # distinct, retryable step; the check itself runs deterministically
        # against the file. Guards against api skills documenting an endpoint
        # the backend renamed/removed, or a request field it no longer accepts.
        if: steps.changed.outputs.full == 'true' || steps.changed.outputs.api != ''
        env:
          API: ${{ steps.changed.outputs.api }}
        run: |
          curl -sS --retry 3 --retry-delay 5 -m 150 \
            "https://api.iblai.app/dm/api/docs/schema/?format=json" \
            -o "$RUNNER_TEMP/iblai_schema.json"
          IBLAI_SCHEMA_FILE="$RUNNER_TEMP/iblai_schema.json" \
            node scripts/check-endpoint-schema.mjs ${API:+--skills $API}

      - name: Skill catalogue matches skills/ (CLAUDE.md + docs/catalogue.md)
        if: steps.changed.outputs.full == 'true' || steps.changed.outputs.any_skill == 'true' || contains(steps.changed.outputs.files, 'CLAUDE.md') || contains(steps.changed.outputs.files, 'README.md') || contains(steps.changed.outputs.files, 'docs/catalogue.md')
        run: node scripts/check-skill-tables.mjs

      - name: Every skill declares a valid metadata.kind
        if: steps.changed.outputs.full == 'true' || steps.changed.outputs.any_skill == 'true'
        run: node scripts/check-skill-kinds.mjs

      - name: No overlay clobbers between skills
        if: steps.changed.outputs.full == 'true' || steps.changed.outputs.any_skill == 'true'
        run: node scripts/test-skills-compose.mjs

      - name: Adapters are regenerated
        if: steps.changed.outputs.full == 'true' || steps.changed.outputs.any_skill == 'true' || contains(steps.changed.outputs.files, 'adapters/')
        run: |
          node scripts/build-adapters.mjs
          git diff --exit-code adapters/ || {
            echo "::error::adapters/ out of date — run 'node scripts/build-adapters.mjs' and commit"; exit 1; }

      - name: Render + typecheck skills against vibe-starter
        if: steps.changed.outputs.full == 'true' || steps.changed.outputs.skills != ''
        env:
          SKILLS: ${{ steps.changed.outputs.skills }}
        run: node scripts/test-skills-render.mjs ${{ steps.changed.outputs.starter == 'true' && '--build' || '' }} ${SKILLS:+--skills $SKILLS}

      - name: App boot smoke (scaffold renders, not just typechecks)
        # Builds vibe-starter and boots it under Playwright — proves the scaffold
        # a user gets actually mounts, catching "compiles but blank/crashes on
        # mount" that tsc can't see. Deterministic, no LLM, no secrets.
        if: steps.changed.outputs.full == 'true'
        run: node scripts/test-skills-boot.mjs

  # ---------------------------------------------------------------- tier 2
  # Agent-executes only the skills the PR touches. Skipped for fork PRs
  # (no secrets) and when no skills changed.
  agent:
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-tests') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed skills / secret availability
        id: gate
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- skills/ | awk -F/ '{print $3}' | sort -u | tr '\n' ' ')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"
          [ -z "$changed" ] && echo "No skills changed — agent tier skipped." || true
          [ "$HAS_KEY" = "false" ] && echo "::notice::ANTHROPIC_API_KEY not available — agent tier skipped." || true

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.changed != '' && steps.gate.outputs.has_key == 'true'
        with:
          package_json_file: ${{ env.STARTER_DIR }}/package.json

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.changed != '' && steps.gate.outputs.has_key == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.STARTER_DIR }}/pnpm-lock.yaml

      - name: Run changed skills through a headless agent
        if: steps.gate.outputs.changed != '' && steps.gate.outputs.has_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          npm i -g @anthropic-ai/claude-code
          ./scripts/test-skills-agent.sh --changed

  # ---------------------------------------------------------------- tier 3
  # Live platform smoke: agent-builds the core chain, then real SSO login.
  # Manual dispatch + weekly schedule; skips cleanly without secrets.
  # Log hygiene: secrets only via ${{ secrets.* }} (auto-masked); server and
  # Playwright output stay in files; no artifacts are uploaded.
  live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: gate
        env:
          READY: ${{ secrets.ANTHROPIC_API_KEY != '' && secrets.IBLAI_TEST_USERNAME != '' && secrets.IBLAI_TEST_PASSWORD != '' }}
        run: |
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          [ "$READY" = "false" ] && echo "::notice::live secrets not configured — live tier skipped." || true

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          package_json_file: ${{ env.STARTER_DIR }}/package.json

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.STARTER_DIR }}/pnpm-lock.yaml

      - name: Install Playwright browser
        if: steps.gate.outputs.ready == 'true'
        working-directory: ${{ env.STARTER_DIR }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install chromium --with-deps

      - name: Agent-build core chain + live SSO smoke
        if: steps.gate.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_LIVE: "1"
          AUTH_HOST: ${{ vars.IBLAI_TEST_AUTH_HOST || 'https://login.iblai.app' }}
          PLAYWRIGHT_USERNAME: ${{ secrets.IBLAI_TEST_USERNAME }}
          PLAYWRIGHT_PASSWORD: ${{ secrets.IBLAI_TEST_PASSWORD }}
          IBLAI_TEST_TENANT_KEY: ${{ vars.IBLAI_TEST_TENANT_KEY }}
          IBLAI_TEST_AGENT_ID: ${{ vars.IBLAI_TEST_AGENT_ID }}
          IBLAI_TEST_API_KEY: ${{ secrets.IBLAI_TEST_API_KEY }}
        run: |
          npm i -g @anthropic-ai/claude-code
          ./scripts/test-skills-agent.sh iblai-vibe-auth iblai-vibe-navbar iblai-vibe-agent-chat
